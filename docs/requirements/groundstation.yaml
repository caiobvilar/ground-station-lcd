# docs/requirements/groundstation.yaml
# Requirements for ground-station-lcd. Scaffolded project — no code yet.
# All requirements are draft; code will be written against these after G1 review.
- id: GS-FUN-001
  text: >
    The ground station shall initialize the LTDC/DSI display subsystem and
    external SDRAM in SystemInit before any application code accesses the
    framebuffer.
  type: functional
  rationale: >
    N-01 requires the display to be the first subsystem brought up. The
    F469's LTDC/DSI and SDRAM initialization ordering is a hard constraint;
    accessing SDRAM before it is configured causes a hard fault.
  parent: N-01
  priority: shall
  verification: test
  status: draft
- id: GS-FUN-002
  text: >
    The ground station shall render a live telemetry dashboard received from
    the bench compute boards over the debug protocol.
  type: functional
  rationale: >
    N-01 requires the display to show real-time values from the EdgeAI trio
    (tinyml-m0, gesture-imu, vibration-fault-predict). The framing protocol
    between compute boards and the ground station is defined in an ADR.
  parent: N-01
  priority: shall
  verification: test
  status: draft
- id: GS-PER-001
  text: >
    The framebuffer update latency (protocol receipt → visible update) shall
    not exceed 50 ms at 60 Hz refresh.
  type: performance
  rationale: >
    N-02 requires a responsive readout. 50 ms is the upper bound for
    "live" perception at 60 Hz.
  parent: N-02
  priority: shall
  verification: test
  status: draft
- id: GS-INT-001
  text: >
    The dashboard renderer shall communicate with the receive logic through
    the port interface without hardware-specific code.
  type: interface
  rationale: >
    N-03 requires host-testable domain logic per the architecture rule.
  parent: N-03
  priority: shall
  verification: analysis
  status: draft
- id: GS-CON-001
  text: >
    The domain code shall compile on the host without any hardware or vendor
    includes.
  type: constraint
  rationale: >
    N-03 requires the layering rule to be enforceable by CI.
  parent: N-03
  priority: should
  verification: analysis
  status: draft